<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rehmaan Hostel FSD - Meal & Expense Tracker</title>
    <!-- Importing a stylish Google Font for Azlan's signature -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --border: #334155;
            --table-header: #0f172a;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: var(--text-main);
            margin: 0;
            padding: 30px 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 10px 10px -5px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            overflow: hidden;
            position: relative;
        }

        /* Custom Hostel Image Banner */
        .hostel-banner {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-bottom: 1px solid var(--border);
        }

        .content-padding {
            padding: 25px 30px;
        }

        h2 {
            text-align: center;
            color: var(--text-main);
            margin-top: 0;
            margin-bottom: 5px;
            font-size: 22px;
            font-weight: 700;
        }

        .subtitle {
            text-align: center;
            color: var(--primary);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 25px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: var(--text-muted);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            background-color: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            box-sizing: border-box;
            font-size: 14px;
            transition: all 0.2s ease;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .btn-container {
            display: flex;
            gap: 12px;
            margin-top: 10px;
            grid-column: span 2;
        }

        button {
            flex: 1;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .clear-btn {
            background-color: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
        }

        .clear-btn:hover {
            background-color: var(--danger);
            color: white;
        }

        .total-box {
            margin-top: 25px;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 16px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            color: #60a5fa;
        }

        .table-container {
            margin-top: 25px;
            max-height: 220px;
            overflow-y: auto;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        th, td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
        }

        th {
            background-color: var(--table-header);
            color: var(--text-muted);
            font-weight: 600;
            position: sticky;
            top: 0;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .no-data {
            text-align: center;
            color: var(--text-muted);
            padding: 20px;
        }

        /* Stylish Developer Signature for Azlan */
        .developer-footer {
            margin-top: 25px;
            text-align: center;
            border-top: 1px dashed var(--border);
            padding-top: 15px;
        }

        .developer-footer p {
            margin: 0;
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 1px;
        }

        .developer-footer span {
            font-family: 'Cinzel', serif;
            font-size: 15px;
            color: #38bdf8;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- User Provided Image Link as Banner -->
        <img src="https://freeimage.host/i/n0N4QZG" alt="Rehmaan Hostel Banner" class="hostel-banner">

        <div class="content-padding">
            <h2>REHMAAN HOSTEL FSD</h2>
            <div class="subtitle">🍽️ Meal & Expense Tracker</div>
            
            <div class="form-grid">
                <div class="form-group">
                    <label for="mealType">Meal Time</label>
                    <select id="mealType">
                        <option value="Breakfast">Breakfast</option>
                        <option value="Lunch">Lunch</option>
                        <option value="Dinner">Dinner</option>
                        <option value="Tea / Snacks">Tea / Snacks</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="foodDate">Date</label>
                    <input type="date" id="foodDate">
                </div>

                <div class="form-group">
                    <label for="foodName">Food Item</label>
                    <input type="text" id="foodName" placeholder="e.g., Daal Chawal">
                </div>

                <div class="form-group">
                    <label for="foodPrice">Price (PKR)</label>
                    <input type="number" id="foodPrice" placeholder="e.g., 150">
                </div>

                <div class="btn-container">
                    <button onclick="addMeal()">Save Record</button>
                    <button class="clear-btn" onclick="clearAllData()">Clear All</button>
                </div>
            </div>

            <div class="total-box">
                Total Expense: <span id="totalExpense">0</span> PKR
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Meal</th>
                            <th>Item</th>
                            <th>Price</th>
                        </tr>
                    </thead>
                    <tbody id="mealTableBody">
                        <!-- Data will load here -->
                    </tbody>
                </table>
            </div>

            <!-- Stylish Azlan Signature Footer -->
            <div class="developer-footer">
                <p>DESIGNED & CRAFTED BY</p>
                <span>AZLAN</span>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('foodDate').valueAsDate = new Date();

        window.onload = function() {
            displayMeals();
        };

        function addMeal() {
            const mealType = document.getElementById('mealType').value;
            const foodName = document.getElementById('foodName').value.trim();
            const foodPrice = parseFloat(document.getElementById('foodPrice').value) || 0;
            const foodDate = document.getElementById('foodDate').value;

            if (foodName === "" || foodPrice <= 0) {
                alert("Please enter a valid food name and price!");
                return;
            }

            const newMeal = {
                date: foodDate,
                type: mealType,
                name: foodName,
                price: foodPrice
            };

            let meals = JSON.parse(localStorage.getItem('rehmaanHostelMeals')) || [];
            meals.push(newMeal);
            localStorage.setItem('rehmaanHostelMeals', JSON.stringify(meals));

            document.getElementById('foodName').value = "";
            document.getElementById('foodPrice').value = "";
            
            displayMeals();
        }

        function displayMeals() {
            const tableBody = document.getElementById('mealTableBody');
            tableBody.innerHTML = "";

            let meals = JSON.parse(localStorage.getItem('rehmaanHostelMeals')) || [];
            let total = 0;

            if (meals.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="4" class="no-data">No records found</td></tr>`;
            } else {
                meals.slice().reverse().forEach(meal => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${meal.date}</td>
                        <td>${meal.type}</td>
                        <td>${meal.name}</td>
                        <td><strong>${meal.price}</strong> PKR</td>
                    `;
                    tableBody.appendChild(row);
                    total += meal.price;
                });
            }

            document.getElementById('totalExpense').innerText = total;
        }

        function clearAllData() {
            if (confirm("Are you sure you want to delete all records?")) {
                localStorage.removeItem('rehmaanHostelMeals');
                displayMeals();
            }
        }
    </script>

</body>
</html>
